# CI: valida build, lint y tests en cada PR a main/develop
# No usa commitlint porque ya lo validas localmente con suggest-commit.js

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

# Cancela runs previos en la misma branch (ahorra minutos de GitHub Actions)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # historial completo para changelog

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build

      - name: Tests (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm test
        env:
          CI: 'true'

  # Job opcional: comenta el PR con resumen (si tenes permiso)
  comment-summary:
    needs: validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      pull-requests: write
    steps:
      - name: Comentar resultado en PR
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- ci-summary -->';
            const body = `${marker}
            ## CI Summary

            - [x] Type check
            - [x] Build
            - [x] Tests

            **${context.workflow}** completed successfully on ${{ github.event.pull_request.head.sha }}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
