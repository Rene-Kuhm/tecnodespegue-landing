# GitHub Actions: ping Google + Bing cuando se actualiza el sitemap
# Se dispara con cada push a main (post-deploy hook).
# Acelera la indexación de 3-7 días a 1-2 días.

name: Ping Sitemaps

on:
  push:
    branches: [main]
    paths:
      - 'src/content/posts/**'
      - 'src/content/templates/**'
      - 'public/sitemap*.xml'
      - 'src/pages/**.astro'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Google
        run: |
          curl -fsS -A "TecnoDespegue Sitemap Ping (https://www.tecnodespegue.com)" \
            "https://www.google.com/ping?sitemap=https://www.tecnodespegue.com/sitemap-index.xml"
        continue-on-error: true

      - name: Ping Bing
        run: |
          curl -fsS -A "TecnoDespegue Sitemap Ping (https://www.tecnodespegue.com)" \
            "https://www.bing.com/ping?sitemap=https://www.tecnodespegue.com/sitemap-index.xml"
        continue-on-error: true

      - name: Log result
        if: always()
        run: |
          echo "Sitemap ping completo. Google + Bing notificados."